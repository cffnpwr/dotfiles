name: Terraform plan
on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      # NOTE: bootstrapのrootは手元でapplyするためCIのplanの対象外
      - "!terraform/bootstrap/**"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/terraform-plan.yaml"

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  plan:
    name: Plan terraform
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: terraform-plan
    permissions:
      contents: read
      pull-requests: write
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.PLAN_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLAN_APP_PRIVATE_KEY }}
          permission-environments: read
      - uses: cffnpwr/actions/.github/actions/terraform-plan@e6fa8778bf73fd148e6063bca4569bcf88d3df9e # main
        with:
          root: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_github_token: ${{ steps.app-token.outputs.token }}
