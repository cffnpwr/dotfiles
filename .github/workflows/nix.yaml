name: Nix
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  hosts:
    name: List hosts
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      hosts: ${{ steps.hosts.outputs.hosts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
      - id: hosts
        run: |
          hosts=$(nix eval --json --impure --expr 'import ./.github/nix/hosts.nix (builtins.getFlake (toString ./.))')
          echo "hosts=$hosts" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: hosts
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.hosts.outputs.hosts) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
      - run: nix build --accept-flake-config --no-link ".#${ATTR}"
        env:
          ATTR: ${{ matrix.attr }}
